<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex CSS</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <h1>Galería Responsiva de Imágenes</h1>

        <section class="gallery">
            <figure>
                <img src="Images/MountainousFjordAndCliff.png" alt="Fiordo de montaña con un acantilado que sobresale">
                <figcaption>Imagen 1</figcaption>
            </figure>

            <figure>
                <img src="Images/BridgeAndForest.png" alt="Puente de madera en un bosque">
                <figcaption>Imagen 2</figcaption>
            </figure>

            <figure>
                <img src="Images/PolarLights.png" alt="Aurora boreal en el cielo de un paisaje con una cabaña en medio de montañas nevadas">
                <figcaption>Imagen 3</figcaption>
            </figure>

            <figure>
                <img src="Images/Lake.png" alt="Lago turquesa rodeado de bosques y picos de montañas nevadas">
                <figcaption>Imagen 4</figcaption>
            </figure>

            <figure>
                <img src="Images/Lighthouse.png" alt="Faro junto al mar en un paisaje costero">
                <figcaption>Imagen 5</figcaption>
            </figure>

            <figure>
                <img src="Images/Desert.png" alt="Paisaje desertico con dunas de arena">
                <figcaption>Imagen 6</figcaption>
            </figure>

            <figure>
                <img src="Images/Waterfall.png" alt="Cascada cayendo entre rocas y vegetacion">
                <figcaption>Imagen 7</figcaption>
            </figure>

            <figure>
                <img src="Images/Island.png" alt="Isla tropical rodeada de agua azul">
                <figcaption>Imagen 8</figcaption>
            </figure>
        </section>
    </main>
</body>
</html>
